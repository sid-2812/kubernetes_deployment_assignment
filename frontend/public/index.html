<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Deployment</title>
</head>
<body>
    <h1>AWS Deployment Demo</h1>
    <p>Flask Backend Status:</p>
    <p id="status">Checking backend...</p>

    <button onClick="getBackendData()">Get Backend Data</button>

    <p id="data"></p>

    <script>
        async function checkBackendStatus() {
            try {
                const response = await fetch('/api/backend-data');
                const data = await response.json();
                document.getElementById('status').textContent = data.message;
            } catch (error) {
                document.getElementById('status').textContent = 'Error connecting to backend';
            }
        }

        async function getBackendData() {
            try {
                const response = await fetch('/api/backend-data');
                const data = await response.json();
                document.getElementById('data').textContent = data.message;
            } catch (error) {
                document.getElementById('data').textContent = 'Error fetching backend data';
            }
        }

        checkBackend();
    </script>
</body>
</html>
